<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kanchiveda – Saree Catalog</title>
  <meta name="description" content="Kanchiveda saree catalog – Semi Silk, Kanchicotton and Soft Silk sarees." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== HEADER – maroon bg, kanchiveda white text ===== -->
  <header class="site-header">
    <span class="header-brand-text">kanchiveda</span>
  </header>

  <!-- ===== CATEGORY TABS ===== -->
  <nav class="tab-bar">
    <button class="tab active" data-cat="semi-silk">Semi Silk</button>
    <button class="tab"        data-cat="kanchicotton">Kanchicotton</button>
    <button class="tab"        data-cat="soft-silk">Soft Silk</button>
  </nav>

  <!-- ===== CATALOG ===== -->
  <main class="catalog">

    <!-- SEMI SILK -->
    <section class="cat-section active" id="cat-semi-silk">
      <div class="product-grid">

        <div class="product-card"
             data-price="3,299">
          <div class="card-img-wrap">
            <img src="C:\Users\Karthik\Downloads\sss1.jpeg" alt="Semi Silk Set 1" loading="lazy" />
            <span class="expand-icon">⤢</span>
          </div>
          <div class="card-info">
            <span class="card-price">3,299</span>
          </div>
        </div>

        <div class="product-card"
             data-price="2,999">
          <div class="card-img-wrap">
            <img src="C:\Users\Karthik\Downloads\sss2.jpeg" alt="Semi Silk Set 2" loading="lazy" />
            <span class="expand-icon">⤢</span>
          </div>
          <div class="card-info">
            <span class="card-price">2,999</span>
          </div>
        </div>

        <div class="product-card"
             data-price="1,499-1,999">
          <div class="card-img-wrap">
            <img src="C:\Users\Karthik\Downloads\sss3.jpeg" alt="Semi Silk Set 3" loading="lazy" />
            <span class="expand-icon">⤢</span>
          </div>
          <div class="card-info">
            <span class="card-price">1,499-1,999</span>
          </div>
        </div>

        <div class="product-card"
             data-price="4,299-4,499">
          <div class="card-img-wrap">
            <img src="C:\Users\Karthik\Downloads\sss4.jpeg" alt="Semi Silk Set 4" loading="lazy" />
            <span class="expand-icon">⤢</span>
          </div>
          <div class="card-info">
            <span class="card-price">4,299-4,499</span>
          </div>
        </div>

      </div>
    </section>

    <!-- KANCHICOTTON -->
    <section class="cat-section" id="cat-kanchicotton">
      <div class="product-grid">

        <div class="product-card"
             data-price="2,299">
          <div class="card-img-wrap">
            <img src="C:\Users\Karthik\Downloads\kanchicotton1.jpeg" alt="Kanchicotton Set 1" loading="lazy" />
            <span class="expand-icon">⤢</span>
          </div>
          <div class="card-info">
            <span class="card-price">2,299</span>
          </div>
        </div>

        <div class="product-card"
             data-price="1,699">
          <div class="card-img-wrap">
            <img src="C:\Users\Karthik\Downloads\kanchicotton2.jpeg" alt="Kanchicotton Set 2" loading="lazy" />
            <span class="expand-icon">⤢</span>
          </div>
          <div class="card-info">
            <span class="card-price">1,699</span>
          </div>
        </div>

      </div>
    </section>

    <!-- SOFT SILK -->
    <section class="cat-section" id="cat-soft-silk">
      <div class="product-grid">

        <div class="product-card"
             data-price="2,299-3,599">
          <div class="card-img-wrap">
            <img src="C:\Users\Karthik\Downloads\softsilk.jpeg" alt="Soft Silk Set 1" loading="lazy" />
            <span class="expand-icon">⤢</span>
          </div>
          <div class="card-info">
            <span class="card-price">2,299-3,599</span>
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- ===== FULLSCREEN LIGHTBOX ===== -->
  <div id="lightbox" class="lightbox">
    <!-- Close button -->
    <button id="lb-close" class="lb-close">✕ Close</button>

    <!-- Image -->
    <div class="lb-img-wrap">
      <img id="lb-img" src="" alt="" />
    </div>

    <!-- Caption + Order button -->
    <div class="lb-footer">
      <div class="lb-info">
        <span id="lb-title" class="lb-title"></span>
        <span id="lb-price" class="lb-price"></span>
      </div>
      <a id="lb-order-btn" href="#" target="_blank" rel="noopener" class="lb-order-btn">
        💬 Enquire on WhatsApp
      </a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
